backend:
  name: github
  repo: devjoshweb/A-contre-pied
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
locale: fr
media_folder: public/uploads
public_folder: /uploads
collections:
  - name: articles
    label: Articles
    label_singular: Article
    folder: src/content/articles
    create: true
    extension: md
    slug: "{{year}}-{{month}}-{{slug}}"
    summary: "{{section}} — {{title}}"
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: Rubrique, name: section, widget: select, options: ["Sport", "Politique", "Société"] }
      - { label: Date de publication, name: date, widget: datetime, format: "YYYY-MM-DDTHH:mm:ss.SSS[Z]" }
      - { label: Auteur, name: author, widget: string, default: "Yenael Fort" }
      - { label: Chapô (accroche), name: chapo, widget: text, required: false }
      - { label: Image de couverture, name: image, widget: image, required: false }
      - { label: Texte, name: body, widget: markdown }
